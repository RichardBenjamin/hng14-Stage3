# How many simultaneous connections each worker can handle
events {
    worker_connections 1024;
}

http {

    # Tell Nginx to read the real client IP from this header
    # instead of the IP of whoever connected directly
    real_ip_header X-Forwarded-For;

    # Trust requests coming from Docker's internal network
    # These are the internal IPs Docker assigns to containers
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;

    # Define our JSON log format
    # Each field maps an Nginx variable to a JSON key
    log_format json_combined escape=json
        '{'
            '"source_ip":"$remote_addr",'
            '"timestamp":"$time_iso8601",'
            '"method":"$request_method",'
            '"path":"$request_uri",'
            '"status":$status,'
            '"response_size":$body_bytes_sent'
        '}';

    server {
        # Listen on port 80 for all incoming HTTP traffic
        listen 80;

        # Write access logs in our JSON format to this file
        # This path matches exactly what is in config.yaml
        access_log /var/log/nginx/hng-access.log json_combined;

        # Handle all incoming URLs
        location / {
            # Forward requests to Nextcloud
            # "nextcloud" is the service name in docker-compose
            # Docker resolves this name to the right container IP
            proxy_pass http://nextcloud;

            # Pass the real client IP to Nextcloud
            proxy_set_header X-Forwarded-For $remote_addr;

            # Pass the original host header so Nextcloud
            # knows what domain was requested
            proxy_set_header Host $host;

            # Tell Nextcloud whether the original request was
            # HTTP or HTTPS
            proxy_set_header X-Forwarded-Proto $scheme;

            # Pass the real IP as X-Real-IP as well
            # Nextcloud checks both headers
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
